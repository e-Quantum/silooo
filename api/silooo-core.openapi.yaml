openapi: 3.0.3
info:
  title: silooo-core, API interne
  version: 0.1.0
  description: |
    Contrat entre l'add-on Silooo (Script API, module @minecraft/server-net) et le service Kotlin silooo-core.

    Règles communes :
    - L'API n'écoute que sur le réseau interne (Docker) ; jamais exposée sur Internet.
    - Chaque appel porte l'en-tête `X-Silooo-Key` : un secret partagé, rangé côté BDS dans les
      secrets de @minecraft/server-admin (jamais dans le code de l'add-on).
    - Le service décide de tout : l'add-on envoie une intention (« monter la Scierie au prochain palier »),
      le service vérifie, calcule, écrit et renvoie le nouvel état.
    - Tout appel qui modifie quelque chose porte un `requestId` (UUID) : rejoué après une coupure,
      il renvoie la même réponse sans refaire l'action.
    - Le Donar est un nombre à virgule (double) ; Lingots, Gemmes, jetons et clés sont des entiers.
    - Le service ne peut pas appeler l'add-on : l'add-on interroge `/v1/events` à intervalle court.
    - Toute opération peut répondre 400, 401, 500 ou 501 avec le corps `Erreur` : la forme de la
      requête, la clé, une panne du service ou une route pas encore écrite. Ces codes ne viennent
      pas du jeu ; l'add-on les traite d'un bloc (réessayer, ou dire qu'Oooscar ne répond pas).
servers:
  - url: http://silooo-core:8080
    description: réseau Docker interne
security:
  - cleServeur: []

paths:
  /v1/server/heartbeat:
    post:
      summary: Le serveur Bedrock signale qu'il tourne et qui est en ligne
      operationId: heartbeat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [serverId, onlineXuids]
              properties:
                serverId: { type: string, example: bds-1 }
                onlineXuids: { type: array, items: { $ref: '#/components/schemas/Xuid' } }
      responses:
        '400': { $ref: '#/components/responses/Erreur' }
        '401': { $ref: '#/components/responses/Erreur' }
        '500': { $ref: '#/components/responses/Erreur' }
        '501': { $ref: '#/components/responses/Erreur' }
        '204': { description: noté }

  /v1/events:
    get:
      summary: Événements à afficher en jeu depuis le curseur donné (Gemmes reçues, commande terminée…)
      operationId: pollEvents
      parameters:
        - { name: after, in: query, required: true, schema: { type: integer, format: int64 }, description: dernier id déjà reçu }
        - { name: limit, in: query, schema: { type: integer, default: 100, maximum: 500 } }
      responses:
        '400': { $ref: '#/components/responses/Erreur' }
        '401': { $ref: '#/components/responses/Erreur' }
        '500': { $ref: '#/components/responses/Erreur' }
        '501': { $ref: '#/components/responses/Erreur' }
        '200':
          description: événements, du plus ancien au plus récent
          content:
            application/json:
              schema:
                type: object
                required: [events, cursor]
                properties:
                  cursor: { type: integer, format: int64 }
                  events: { type: array, items: { $ref: '#/components/schemas/GameEvent' } }

  /v1/session/join:
    post:
      summary: Un joueur arrive ; crée son profil et son entreprise au premier passage
      operationId: join
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [xuid, gamertag]
              properties:
                xuid: { $ref: '#/components/schemas/Xuid' }
                gamertag: { type: string, maxLength: 32 }
      responses:
        '400': { $ref: '#/components/responses/Erreur' }
        '401': { $ref: '#/components/responses/Erreur' }
        '500': { $ref: '#/components/responses/Erreur' }
        '501': { $ref: '#/components/responses/Erreur' }
        '409': { $ref: '#/components/responses/Refused' }
        '200':
          description: tout ce qu'il faut pour afficher le joueur
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JoinResponse' }

  /v1/session/leave:
    post:
      summary: Un joueur part ; fige l'heure pour le calcul hors ligne
      operationId: leave
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [xuid]
              properties:
                xuid: { $ref: '#/components/schemas/Xuid' }
      responses:
        '400': { $ref: '#/components/responses/Erreur' }
        '401': { $ref: '#/components/responses/Erreur' }
        '500': { $ref: '#/components/responses/Erreur' }
        '501': { $ref: '#/components/responses/Erreur' }
        '409': { $ref: '#/components/responses/Refused' }
        '204': { description: noté }

  /v1/companies/{companyId}:
    get:
      summary: État complet de l'entreprise (usines, revenu, Donar)
      operationId: getCompany
      parameters: [ { $ref: '#/components/parameters/CompanyId' } ]
      responses:
        '400': { $ref: '#/components/responses/Erreur' }
        '401': { $ref: '#/components/responses/Erreur' }
        '500': { $ref: '#/components/responses/Erreur' }
        '501': { $ref: '#/components/responses/Erreur' }
        '200':
          description: état courant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompanyState' }

  /v1/companies/{companyId}/collect:
    post:
      summary: Encaisse la production depuis le dernier passage (hors ligne compris, avec plafond)
      operationId: collect
      parameters: [ { $ref: '#/components/parameters/CompanyId' } ]
      requestBody: { $ref: '#/components/requestBodies/Action' }
      responses:
        '400': { $ref: '#/components/responses/Erreur' }
        '401': { $ref: '#/components/responses/Erreur' }
        '500': { $ref: '#/components/responses/Erreur' }
        '501': { $ref: '#/components/responses/Erreur' }
        '409': { $ref: '#/components/responses/Refused' }
        '200':
          description: ce qui a été encaissé et le nouvel état
          content:
            application/json:
              schema:
                type: object
                required: [collected, offlineHours, state]
                properties:
                  collected: { $ref: '#/components/schemas/Donar' }
                  offlineHours: { type: number, description: 'heures comptées : pleines en régime en ligne, plafonnées par l''entreprise en régime hors ligne' }
                  state: { $ref: '#/components/schemas/CompanyState' }

  /v1/companies/{companyId}/factories/{factoryId}/levels:
    post:
      summary: Monte une usine de niveau(x)
      operationId: buyLevels
      parameters:
        - { $ref: '#/components/parameters/CompanyId' }
        - { $ref: '#/components/parameters/FactoryId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ActionBase'
                - type: object
                  required: [amount]
                  properties:
                    amount:
                      type: string
                      enum: ['1', '10', 'palier', 'max']
                      description: palier = jusqu'au prochain ×2 ; max = tout ce qu'on peut payer
      responses:
        '400': { $ref: '#/components/responses/Erreur' }
        '401': { $ref: '#/components/responses/Erreur' }
        '500': { $ref: '#/components/responses/Erreur' }
        '501': { $ref: '#/components/responses/Erreur' }
        '200': { $ref: '#/components/responses/CompanyUpdated' }
        '409': { $ref: '#/components/responses/Refused' }

  /v1/companies/{companyId}/factories/{factoryId}/restore:
    post:
      summary: Avance la remise en état d'une usine (dialogue, tâches, livraison, recrutement)
      description: |
        Chaque étape publie un événement `ANNONCE` dont `payload.action` vaut `restoreStep`. La quatrième étape, qui
        remet l'usine en marche, publie en plus un événement `ANNONCE` dont `payload.action` vaut `sansCourant` quand
        cette usine dépend de l'électricité et qu'elle s'arrête faute de Centrale (`definitions/incidents.json`,
        `electricite`) alors que l'entreprise n'avait encore aucune usine arrêtée de ce fait : une seule fois par
        passage à l'état sans courant. Il est adressé à celui qui agit (`xuid`) et porte `companyId`, `factoryId`,
        `factoryName` et `playerName`. Le bot Discord (`docs/discord.md`) le lit.
      operationId: restoreStep
      parameters:
        - { $ref: '#/components/parameters/CompanyId' }
        - { $ref: '#/components/parameters/FactoryId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ActionBase'
                - type: object
                  required: [step]
                  properties:
                    step: { type: integer, minimum: 1, maximum: 4 }
      responses:
        '400': { $ref: '#/components/responses/Erreur' }
        '401': { $ref: '#/components/responses/Erreur' }
        '500': { $ref: '#/components/responses/Erreur' }
        '501': { $ref: '#/components/responses/Erreur' }
        '200': { $ref: '#/components/responses/CompanyUpdated' }
        '409': { $ref: '#/components/responses/Refused' }

  /v1/companies/{companyId}/incidents/{incidentId}/resolve:
    post:
      summary: Le mini-jeu de réparation est réussi ; relance l'usine et donne la petite récompense
      description: |
        Clôt l'incident `incidentId` de l'entreprise : l'usine reprend son rythme normal et l'entreprise reçoit en Donar une
        récompense, le nombre de minutes de revenu de l'usine (sans ralentissement) que dit `definitions/incidents.json`. Le
        Donar produit jusqu'à cet instant est versé d'abord, au rythme ralenti. Le service ne juge pas le mini-jeu : l'add-on
        l'a joué, le service clôt. Un incident qui n'est plus ouvert (un associé l'a déjà réparé, un prestige l'a clos) ne
        change rien et ne rapporte rien : la réponse est le même 200, avec l'état d'aujourd'hui. Un incident qui n'existe
        pas, ou qui est à une autre entreprise, un acteur qui n'est pas de l'entreprise : 400. L'ouverture et la clôture d'un
        incident sont aussi annoncées par l'événement `INCIDENT` (voir `GameEvent`).
      operationId: resolveIncident
      parameters:
        - { $ref: '#/components/parameters/CompanyId' }
        - { name: incidentId, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody: { $ref: '#/components/requestBodies/Action' }
      responses:
        '400': { $ref: '#/components/responses/Erreur' }
        '401': { $ref: '#/components/responses/Erreur' }
        '500': { $ref: '#/components/responses/Erreur' }
        '501': { $ref: '#/components/responses/Erreur' }
        '409': { $ref: '#/components/responses/Refused' }
        '200': { $ref: '#/components/responses/CompanyUpdated' }

  /v1/companies/{companyId}/agency:
    get:
      summary: Les 5 candidats du jour à l'agence d'emploi
      description: |
        La liste est celle du jour (jour UTC) et de l'entreprise : le service la tire d'après la date et l'entreprise,
        donc la même toute la journée et à chaque lecture, sans rien écrire. Les raretés suivent une répartition fixe
        (`definitions/personnel.json`). Il n'y a ni tirage payant ni nouvelle liste contre du Donar. `slot` va de 1 à 5 :
        c'est le numéro que `hire` prend dans son chemin, et il fixe aussi le rôle proposé. Un candidat déjà embauché
        reste dans la liste et porte alors `staffId` (et `factoryId` s'il est affecté) ; un candidat libre n'a ni l'un ni
        l'autre. `bonusPercent` est le gain de production de sa rareté. Une entreprise inconnue donne 400.
      operationId: getCandidates
      parameters: [ { $ref: '#/components/parameters/CompanyId' } ]
      responses:
        '400': { $ref: '#/components/responses/Erreur' }
        '401': { $ref: '#/components/responses/Erreur' }
        '500': { $ref: '#/components/responses/Erreur' }
        '501': { $ref: '#/components/responses/Erreur' }
        '200':
          description: candidats
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Staff' }

  /v1/companies/{companyId}/agency/{slot}/hire:
    post:
      summary: Embauche un candidat du jour
      description: |
        Embauche le candidat de la place `slot` de la liste du jour (voir `getCandidates`) et le paie en Donar sur
        le compte de l'entreprise. Le prix est un nombre d'heures du revenu de l'entreprise (`definitions/personnel.json`),
        jamais un chiffre fixe. Un membre de l'entreprise, PDG ou associé, peut embaucher. Avec `factoryId`, le candidat
        est affecté à cette usine dans la même écriture ; sans lui, il reste sans usine (il ne coûte rien et ne rapporte
        rien). Refus 409 : `PAS_ASSEZ_DE_DONAR` (avec `missing`), `DEJA_POSSEDE` (ce candidat est déjà embauché),
        `USINE_VERROUILLEE` (l'usine n'est pas à l'entreprise ou n'est pas encore active), `EMPLACEMENT_OCCUPE` (l'usine
        n'a plus de poste libre pour ce rôle), `CONFLIT_REESSAYER` (l'entreprise a changé entre-temps). Une place hors
        1 à 5, une entreprise inconnue ou un acteur qui n'en est pas membre donnent 400. L'embauche publie un événement
        `ANNONCE` dont `payload.action` vaut `hire`.
      operationId: hire
      parameters:
        - { $ref: '#/components/parameters/CompanyId' }
        - { name: slot, in: path, required: true, schema: { type: integer, minimum: 1, maximum: 5 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ActionBase'
                - type: object
                  properties:
                    factoryId: { type: string, example: scierie, description: usine où l'affecter tout de suite }
      responses:
        '400': { $ref: '#/components/responses/Erreur' }
        '401': { $ref: '#/components/responses/Erreur' }
        '500': { $ref: '#/components/responses/Erreur' }
        '501': { $ref: '#/components/responses/Erreur' }
        '200': { $ref: '#/components/responses/CompanyUpdated' }
        '409': { $ref: '#/components/responses/Refused' }

  /v1/companies/{companyId}/staff/{staffId}:
    patch:
      summary: Affecte un membre du personnel à une autre usine
      description: |
        Change l'usine d'un membre du personnel de l'entreprise, sans frais. L'usine doit être à l'entreprise et active
        (`USINE_VERROUILLEE` sinon) et avoir un poste libre pour son rôle (`EMPLACEMENT_OCCUPE` sinon) ; l'affecter à
        l'usine où il est déjà ne change rien. Un `staffId` inconnu ou d'une autre entreprise, comme un acteur qui n'est
        pas membre, donnent 400. 409 `CONFLIT_REESSAYER` si l'entreprise a changé entre-temps. L'affectation publie un
        événement `ANNONCE` dont `payload.action` vaut `assignStaff`.
      operationId: assignStaff
      parameters:
        - { $ref: '#/components/parameters/CompanyId' }
        - { name: staffId, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ActionBase'
                - type: object
                  required: [factoryId]
                  properties:
                    factoryId: { type: string, example: scierie }
      responses:
        '400': { $ref: '#/components/responses/Erreur' }
        '401': { $ref: '#/components/responses/Erreur' }
        '500': { $ref: '#/components/responses/Erreur' }
        '501': { $ref: '#/components/responses/Erreur' }
        '409': { $ref: '#/components/responses/Refused' }
        '200': { $ref: '#/components/responses/CompanyUpdated' }
    delete:
      summary: Renvoie un membre du personnel (seul cas où il part)
      description: |
        Le PDG seulement : un associé reçoit 403 `PAS_LE_PDG`. Le renvoi est définitif et sans remboursement : le
        membre disparaît de l'entreprise et son poste se libère. S'il figure encore dans la liste du jour, sa place se
        libère aussi : il redevient embauchable, au même prix. Un `staffId` inconnu ou d'une autre entreprise,
        comme un acteur qui n'est pas membre, donnent 400. 409 `CONFLIT_REESSAYER` si l'entreprise a changé entre-temps.
        Le renvoi publie un événement `ANNONCE` dont `payload.action` vaut `fireStaff`.
      operationId: fireStaff
      parameters:
        - { $ref: '#/components/parameters/CompanyId' }
        - { name: staffId, in: path, required: true, schema: { type: integer, format: int64 } }
        - { $ref: '#/components/parameters/ActorXuid' }
        - { $ref: '#/components/parameters/RequestId' }
      responses:
        '400': { $ref: '#/components/responses/Erreur' }
        '401': { $ref: '#/components/responses/Erreur' }
        '500': { $ref: '#/components/responses/Erreur' }
        '501': { $ref: '#/components/responses/Erreur' }
        '403': { $ref: '#/components/responses/Refused' }
        '409': { $ref: '#/components/responses/Refused' }
        '200': { $ref: '#/components/responses/CompanyUpdated' }

  /v1/companies/{companyId}/prestige/preview:
    get:
      summary: Ce que rapporterait un prestige maintenant (Lingots, part de chacun, époque ou étoile suivante)
      operationId: prestigePreview
      parameters: [ { $ref: '#/components/parameters/CompanyId' } ]
      responses:
        '400': { $ref: '#/components/responses/Erreur' }
        '401': { $ref: '#/components/responses/Erreur' }
        '500': { $ref: '#/components/responses/Erreur' }
        '501': { $ref: '#/components/responses/Erreur' }
        '200':
          description: aperçu
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrestigePreview' }

  /v1/companies/{companyId}/prestige:
    post:
      summary: Lance le prestige (le PDG seulement) ; remet le Donar et les usines à zéro, partage les Lingots
      description: |
        Chaque membre reçoit un événement `ANNONCE` dont `payload.action` vaut `prestige` (sa part de Lingots, `lingots`,
        et le total, `lingotsTotal`). Tout le serveur reçoit en plus un événement `PRESTIGE_ENTREPRISE` (sans `xuid`) dont
        le `payload` porte `companyId`, `companyName`, `lingots` (le total gagné, avant partage) et `prestigeCount` (le
        numéro de la course qui vient de se terminer). Le bot Discord (`docs/discord.md`) le lit.
      operationId: prestige
      parameters: [ { $ref: '#/components/parameters/CompanyId' } ]
      requestBody: { $ref: '#/components/requestBodies/Action' }
      responses:
        '400': { $ref: '#/components/responses/Erreur' }
        '401': { $ref: '#/components/responses/Erreur' }
        '500': { $ref: '#/components/responses/Erreur' }
        '501': { $ref: '#/components/responses/Erreur' }
        '200': { $ref: '#/components/responses/CompanyUpdated' }
        '403': { $ref: '#/components/responses/Refused' }
        '409': { $ref: '#/components/responses/Refused' }

  /v1/companies/{companyId}/members:
    post:
      summary: Invite un joueur comme associé (le PDG seulement, 4 membres au plus)
      description: |
        Le PDG invite le joueur `targetXuid`, qui doit avoir joué au moins une fois (tout joueur a une entreprise depuis
        son premier `join`). L'invitation ne change rien à l'entreprise : elle est gardée un temps (`definitions/monde.json`,
        `entreprise.invitationHeures`), puis périmée, et le joueur invité la reçoit par un événement `INVITATION` (adressé
        à lui) dont le `payload` porte `companyId`, `companyName`, `invitedBy` (XUID du PDG), `invitedByName` (son gamertag)
        et `expiresAt` (date ISO 8601 UTC). L'invité l'accepte avec `acceptInvite`. Inviter de nouveau le même joueur
        renouvelle l'invitation, sans en créer une seconde. La réponse est l'état de l'entreprise, inchangé.
        Refus : 403 `PAS_LE_PDG` (l'acteur est un associé) ; 409 `ENTREPRISE_PLEINE` (l'entreprise a déjà le nombre
        maximal de membres, `entreprise.membresMax`), `DEJA_POSSEDE` (le joueur est déjà membre de cette entreprise),
        `ENTREPRISE_EN_COURS` (l'entreprise du joueur invité est déjà lancée : voir `acceptInvite`), `CONFLIT_REESSAYER`.
        Un joueur inconnu du service, le PDG qui s'invite lui-même, une entreprise inconnue ou un acteur qui n'en est pas
        membre donnent 400.
      operationId: invite
      parameters: [ { $ref: '#/components/parameters/CompanyId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ActionBase'
                - type: object
                  required: [targetXuid]
                  properties:
                    targetXuid:
                      allOf: [ { $ref: '#/components/schemas/Xuid' } ]
                      example: '2535428000000002'
      responses:
        '400': { $ref: '#/components/responses/Erreur' }
        '401': { $ref: '#/components/responses/Erreur' }
        '500': { $ref: '#/components/responses/Erreur' }
        '501': { $ref: '#/components/responses/Erreur' }
        '200': { $ref: '#/components/responses/CompanyUpdated' }
        '403': { $ref: '#/components/responses/Refused' }
        '409': { $ref: '#/components/responses/Refused' }
    put:
      summary: Le PDG fixe la part de chaque associé (somme = 100)
      description: |
        Le PDG fixe la part de chaque membre, lui compris, dans le partage des Lingots au prestige. `shares` nomme
        chaque membre de l'entreprise une fois et une seule, avec un pourcentage entier de 0 à 100 ; les pourcentages
        font 100 à eux tous. Un associé qui vient d'entrer a une part nulle jusqu'à ce que le PDG la fixe. Une liste qui
        oublie un membre, en nomme un qui n'en est pas, nomme deux fois le même ou ne fait pas 100 donne 400 : la
        requête est fausse, ce n'est pas un refus du jeu. Refus : 403 `PAS_LE_PDG` (l'acteur est un associé),
        409 `CONFLIT_REESSAYER`. Les parts nouvelles sont dans `CompanyState.members` de la réponse. L'écriture publie un
        événement `ANNONCE` dont `payload.action` vaut `setShares` (`companyId`, et `shares` : la liste des `xuid` et `percent`).
      operationId: setShares
      parameters: [ { $ref: '#/components/parameters/CompanyId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ActionBase'
                - type: object
                  required: [shares]
                  properties:
                    shares:
                      type: array
                      items:
                        type: object
                        required: [xuid, percent]
                        properties:
                          xuid: { $ref: '#/components/schemas/Xuid' }
                          percent: { type: integer, minimum: 0, maximum: 100, example: 100 }
      responses:
        '400': { $ref: '#/components/responses/Erreur' }
        '401': { $ref: '#/components/responses/Erreur' }
        '500': { $ref: '#/components/responses/Erreur' }
        '501': { $ref: '#/components/responses/Erreur' }
        '200': { $ref: '#/components/responses/CompanyUpdated' }
        '403': { $ref: '#/components/responses/Refused' }
        '409': { $ref: '#/components/responses/Refused' }

  /v1/companies/{companyId}/members/accept:
    post:
      summary: L'invité accepte l'invitation et devient associé de l'entreprise (part nulle jusqu'à ce que le PDG la fixe)
      description: |
        L'acteur est le joueur invité ; `companyId` est l'entreprise qui l'a invité (`invite`). Il y entre comme
        `ASSOCIE`, avec une part de 0 % : les parts du PDG et des autres membres ne bougent pas, elles font toujours 100.
        La production que l'entreprise a gagnée jusqu'ici lui est versée avant son entrée, au régime d'avant (en ligne si
        un membre est connecté, sinon hors ligne), pour qu'une arrivée ne change pas ce qui a été gagné sans lui. Ses autres
        invitations sont périmées. La réponse est l'état de l'entreprise rejointe.

        Un joueur n'est membre que d'une entreprise. Le sien, créée à son premier `join`, doit être « à son départ » :
        lui seul comme membre, les usines de départ intactes, pas de personnel, pas de zone achetée, aucun prestige.
        Sinon 409 `ENTREPRISE_EN_COURS`. Quand l'invité entre, son entreprise de départ n'est jamais supprimée : elle
        reste telle quelle, sans membre, avec ses usines et son île. Le contrat n'a pas d'opération pour la retrouver
        ni pour quitter une entreprise.

        Refus : 409 `ENTREPRISE_EN_COURS` (voir plus haut), `ENTREPRISE_PLEINE` (l'entreprise s'est remplie depuis
        l'invitation), `DEJA_POSSEDE` (l'acteur est déjà membre de cette entreprise), `CONFLIT_REESSAYER`. Une invitation
        absente ou périmée, une entreprise inconnue donnent 400. L'entrée publie un événement `ANNONCE` dont
        `payload.action` vaut `acceptInvite` (`companyId`, `fromCompanyId` : l'entreprise de départ qu'il quitte).
      operationId: acceptInvite
      parameters: [ { $ref: '#/components/parameters/CompanyId' } ]
      requestBody: { $ref: '#/components/requestBodies/Action' }
      responses:
        '400': { $ref: '#/components/responses/Erreur' }
        '401': { $ref: '#/components/responses/Erreur' }
        '500': { $ref: '#/components/responses/Erreur' }
        '501': { $ref: '#/components/responses/Erreur' }
        '200': { $ref: '#/components/responses/CompanyUpdated' }
        '409': { $ref: '#/components/responses/Refused' }

  /v1/companies/{companyId}/city/zones/{zoneIndex}:
    post:
      summary: Achète la zone suivante de la ville, en Lingots (prix fixe)
      description: |
        Achète la zone `zoneIndex` de la ville, au prix de `definitions/economie.json` (`ville.zonesPrixLingots`), en
        Lingots de celui qui agit : associé ou PDG, les Lingots sont personnels. Les zones s'achètent dans l'ordre, de 1
        à 16. `DEJA_POSSEDE` si la zone est déjà à l'entreprise. `ZONE_VERROUILLEE` si ce n'est pas la zone suivante,
        si la mairie n'a pas le niveau que la zone demande, ou, pour la première zone, si l'entreprise n'a pas assez
        d'usines actives (`definitions/ville.json`, `zones`). `PAS_ASSEZ_DE_LINGOTS`, avec `missing`, si les Lingots
        manquent. Un `zoneIndex` qui n'est pas une zone du jeu, comme un acteur qui n'est pas membre, donnent 400.
        409 `CONFLIT_REESSAYER` si l'entreprise a changé entre-temps. La production en attente est versée avant le
        débit, au multiplicateur d'avant : les Lingots détenus le font bouger. L'achat de la première zone pose la mairie,
        gratuite, à son emplacement de départ. L'achat publie un événement `ANNONCE` dont `payload.action` vaut `buyZone`.
      operationId: buyZone
      parameters:
        - { $ref: '#/components/parameters/CompanyId' }
        - { name: zoneIndex, in: path, required: true, schema: { type: integer, minimum: 1, maximum: 16 } }
      requestBody: { $ref: '#/components/requestBodies/Action' }
      responses:
        '400': { $ref: '#/components/responses/Erreur' }
        '401': { $ref: '#/components/responses/Erreur' }
        '500': { $ref: '#/components/responses/Erreur' }
        '501': { $ref: '#/components/responses/Erreur' }
        '200': { $ref: '#/components/responses/CompanyUpdated' }
        '409': { $ref: '#/components/responses/Refused' }

  /v1/companies/{companyId}/city/buildings:
    post:
      summary: Pose un bâtiment préfabriqué (outil de construction)
      description: |
        Pose un bâtiment du catalogue (`definitions/ville.json`, `batiments`, ceux que le joueur pose) sur la parcelle
        dont le coin est `(x, z)`, en blocs depuis le coin de l'île principale ; une parcelle fait un chunk. Le
        bâtiment est posé au niveau 1, au prix de ce niveau, en Lingots de celui qui agit. Un type inconnu ou que le
        joueur ne pose pas, une parcelle hors de l'île ou qui ne tombe pas sur la grille des parcelles, comme un acteur
        qui n'est pas membre, donnent 400. `ZONE_VERROUILLEE` si la parcelle est dans une zone que l'entreprise n'a pas,
        ou si la mairie n'a pas le niveau que le bâtiment demande. `EMPLACEMENT_OCCUPE` si un bâtiment est déjà sur la
        parcelle. `DEJA_POSSEDE` si l'entreprise a déjà autant de ce bâtiment que le catalogue le permet.
        `PAS_ASSEZ_DE_LINGOTS`, avec `missing`, si les Lingots manquent. 409 `CONFLIT_REESSAYER` si l'entreprise a
        changé entre-temps. La production en attente est versée avant le débit. La pose publie un événement `ANNONCE`
        dont `payload.action` vaut `placeBuilding`.
      operationId: placeBuilding
      parameters: [ { $ref: '#/components/parameters/CompanyId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ActionBase'
                - type: object
                  required: [buildingType, x, z, rotation]
                  properties:
                    buildingType: { type: string, minLength: 1, maxLength: 32, example: maison, description: "identifiant du catalogue des bâtiments (`definitions/ville.json`)" }
                    x: { type: integer, minimum: 0, example: 128, description: "coin de la parcelle (plus petit x), en blocs depuis le coin de l'île principale" }
                    z: { type: integer, minimum: 0, example: 128, description: "coin de la parcelle (plus petit z), en blocs depuis le coin de l'île principale" }
                    rotation: { type: integer, enum: [0, 90, 180, 270] }
      responses:
        '400': { $ref: '#/components/responses/Erreur' }
        '401': { $ref: '#/components/responses/Erreur' }
        '500': { $ref: '#/components/responses/Erreur' }
        '501': { $ref: '#/components/responses/Erreur' }
        '200': { $ref: '#/components/responses/CompanyUpdated' }
        '409': { $ref: '#/components/responses/Refused' }

  /v1/companies/{companyId}/city/buildings/{buildingId}:
    post:
      summary: Améliore un bâtiment d'un niveau
      description: |
        Passe un bâtiment de l'entreprise au niveau suivant, au prix de ce niveau (`definitions/ville.json`), en
        Lingots de celui qui agit. Pour la mairie, c'est ce qui ouvre les zones et les niveaux des autres bâtiments.
        `DEJA_POSSEDE` si le bâtiment est déjà à son dernier niveau. `ZONE_VERROUILLEE` si la mairie n'a pas le niveau
        que ce niveau demande. `PAS_ASSEZ_DE_LINGOTS`, avec `missing`, si les Lingots manquent. Un `buildingId` inconnu
        ou d'une autre entreprise, comme un acteur qui n'est pas membre, donnent 400. 409 `CONFLIT_REESSAYER` si
        l'entreprise a changé entre-temps. La production en attente est versée avant le débit. L'amélioration publie un
        événement `ANNONCE` dont `payload.action` vaut `upgradeBuilding`.
      operationId: upgradeBuilding
      parameters:
        - { $ref: '#/components/parameters/CompanyId' }
        - { name: buildingId, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody: { $ref: '#/components/requestBodies/Action' }
      responses:
        '400': { $ref: '#/components/responses/Erreur' }
        '401': { $ref: '#/components/responses/Erreur' }
        '500': { $ref: '#/components/responses/Erreur' }
        '501': { $ref: '#/components/responses/Erreur' }
        '200': { $ref: '#/components/responses/CompanyUpdated' }
        '409': { $ref: '#/components/responses/Refused' }

  /v1/orders/today:
    get:
      summary: La commande mondiale du jour et sa progression
      description: |
        Une commande par jour, la même pour tout le serveur, tirée de la date (UTC) : la ressource sort du catalogue
        des usines (`definitions/usines.json`, listes `produit`), l'objectif et la prime de `definitions/economie.json`
        (`commandeDuJour`, `lingotsHorsPrestige.commandeDuJour`). Tant que personne n'a livré, la commande n'est écrite
        nulle part : cette route ne fait que lire. Avec `xuid`, `mine` donne la part déjà livrée par ce joueur
        (0 sans `xuid`, ou pour un joueur qui n'a rien livré).
      operationId: todayOrder
      parameters: [ { $ref: '#/components/parameters/PlayerXuidQuery' } ]
      responses:
        '400': { $ref: '#/components/responses/Erreur' }
        '401': { $ref: '#/components/responses/Erreur' }
        '500': { $ref: '#/components/responses/Erreur' }
        '501': { $ref: '#/components/responses/Erreur' }
        '200':
          description: commande du jour
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorldOrder' }

  /v1/orders/today/deliveries:
    post:
      summary: Livre des marchandises à la commande mondiale
      description: |
        Le joueur livre `quantity` unités de la ressource du jour. Chaque unité coûte du Donar à son entreprise : le
        revenu de `definitions/economie.json` (`commandeDuJour.minutesDeProductionParUnite`) en minutes de SON revenu,
        si bien qu'une unité coûte le même temps de jeu à un petit joueur et à un gros. Une livraison qui dépasse ce qui
        reste à livrer est ramenée à ce reste, et seul le Donar de ce reste est pris. Le joueur peut livrer plusieurs
        fois dans la journée : ses parts s'additionnent. Quand le dernier reste est livré, la commande est terminée :
        chaque joueur qui a livré reçoit les Lingots hors prestige de `lingotsHorsPrestige.commandeDuJour`, une seule
        fois, et un événement `COMMANDE_TERMINEE` (`payload` : `day`, `resourceId`, `rewardLingots`). Chaque livraison
        publie un événement `ANNONCE` dont `payload.action` vaut `deliverOrder` (`resourceId`, `quantity`). Quand la
        commande est déjà terminée, il n'y a plus rien à livrer : le service ne prend rien, n'écrit rien et répond 200 avec
        la commande telle qu'elle est (`completed` vrai). Refus : `PAS_ASSEZ_DE_DONAR` (avec `missing`),
        `CONFLIT_REESSAYER`. Un acteur inconnu, ou sans entreprise, donne 400.
      operationId: deliverOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ActionBase'
                - type: object
                  required: [quantity]
                  properties:
                    quantity: { type: integer, format: int64, minimum: 1, description: unités à livrer }
      responses:
        '400': { $ref: '#/components/responses/Erreur' }
        '401': { $ref: '#/components/responses/Erreur' }
        '500': { $ref: '#/components/responses/Erreur' }
        '501': { $ref: '#/components/responses/Erreur' }
        '409': { $ref: '#/components/responses/Refused' }
        '200':
          description: livraison faite (ou rien à livrer, la commande étant déjà terminée) ; la commande à jour, puis l'état de l'entreprise et les soldes de celui qui livre
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderDelivered' }

  /v1/market/listings:
    get:
      summary: Offres ouvertes du marché, par ressource, les moins chères d'abord
      operationId: listMarket
      parameters:
        - { name: resourceId, in: query, schema: { type: string } }
      responses:
        '400': { $ref: '#/components/responses/Erreur' }
        '401': { $ref: '#/components/responses/Erreur' }
        '500': { $ref: '#/components/responses/Erreur' }
        '501': { $ref: '#/components/responses/Erreur' }
        '200':
          description: offres
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Listing' }
    post:
      summary: Met des ressources en vente (prix en Lingots, taxe de 10 % à la vente)
      operationId: createListing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ActionBase'
                - type: object
                  required: [resourceId, quantity, unitPrice]
                  properties:
                    resourceId: { type: string }
                    quantity: { type: integer, format: int64, minimum: 1 }
                    unitPrice: { type: integer, format: int64, minimum: 1 }
      responses:
        '400': { $ref: '#/components/responses/Erreur' }
        '401': { $ref: '#/components/responses/Erreur' }
        '500': { $ref: '#/components/responses/Erreur' }
        '501': { $ref: '#/components/responses/Erreur' }
        '200':
          description: offre créée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Listing' }
        '409': { $ref: '#/components/responses/Refused' }

  /v1/market/listings/{listingId}/buy:
    post:
      summary: Achète tout ou partie d'une offre
      operationId: buyListing
      parameters:
        - { name: listingId, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ActionBase'
                - type: object
                  required: [quantity]
                  properties:
                    quantity: { type: integer, format: int64, minimum: 1 }
      responses:
        '400': { $ref: '#/components/responses/Erreur' }
        '401': { $ref: '#/components/responses/Erreur' }
        '500': { $ref: '#/components/responses/Erreur' }
        '501': { $ref: '#/components/responses/Erreur' }
        '200':
          description: achat fait, soldes mis à jour
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Balances' }
        '409': { $ref: '#/components/responses/Refused' }

  /v1/shop/catalog:
    get:
      summary: Ce qui s'achète en Gemmes en jeu (grades, Pilier, cosmétiques, boosts, pass)
      description: |
        Le catalogue vu par le joueur `actor` (un joueur que le service ne connaît pas donne 400), dans l'ordre de la
        boutique (`definitions/boutique.json`). Les six grades d'abord, dans l'ordre imposé : `owned` si le joueur le
        possède, `available` pour le seul premier grade qu'il n'a pas encore. Puis `pilier` (`owned` tant que
        l'abonnement court ; toujours `available`, pour le prolonger), puis `perso` (`available` seulement si le
        joueur possède le grade Ultime ; `owned` tant que l'abonnement court). Le pass de saison premium (`pass-premium`)
        vient ensuite : `owned` si le joueur l'a déjà pour la saison en cours, `available` tant que la saison court
        et qu'il ne l'a pas ; son prix est celui de `definitions/pass.json`. Les cosmétiques et les boosts s'ajouteront
        ici quand le jeu les vendra.
      operationId: catalog
      parameters: [ { $ref: '#/components/parameters/ActorXuid' } ]
      responses:
        '400': { $ref: '#/components/responses/Erreur' }
        '401': { $ref: '#/components/responses/Erreur' }
        '500': { $ref: '#/components/responses/Erreur' }
        '501': { $ref: '#/components/responses/Erreur' }
        '200':
          description: catalogue, avec ce que le joueur possède déjà
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [itemId, gemmes, owned, available]
                  properties:
                    itemId: { type: string }
                    gemmes: { type: integer, format: int64 }
                    owned: { type: boolean }
                    available: { type: boolean, description: faux pour un grade pas encore débloqué (ordre imposé) }

  /v1/shop/purchases:
    post:
      summary: Achète un article en Gemmes, pour soi ou en cadeau
      description: |
        L'acteur paie `itemId` (un article de `catalog`) avec ses Gemmes. Avec `forXuid`, l'article va à ce joueur
        (qui doit être connu du service) et c'est encore l'acteur qui paie ; les vérifications de possession et d'ordre
        portent alors sur le destinataire. Un `itemId` inconnu ou que le jeu ne vend pas encore, un destinataire
        inconnu ou un acteur que le service ne connaît pas donnent 400. `DEJA_POSSEDE` pour un grade que le
        destinataire a déjà ; `GRADE_PRECEDENT_REQUIS` pour un grade qui n'est pas le premier qu'il n'a pas, et pour
        `perso` quand il n'a pas le grade Ultime ; `PAS_ASSEZ_DE_GEMMES`, avec `missing`, si les Gemmes manquent.
        `pass-premium` ouvre la piste premium du pass de la saison en cours pour le destinataire : `DEJA_POSSEDE` s'il
        l'a déjà, `SAISON_INACTIVE` quand aucune saison ne court (avant son début ou après sa fin) ; cette piste ne
        donne jamais que des cosmétiques (voir `claimPass`).
        409 `CONFLIT_REESSAYER` si le même `requestId` est encore en cours. `pilier` et `perso` durent `jours` de plus
        à partir du plus tard de maintenant et de la fin de l'abonnement ; chaque achat de `pilier` rend aussitôt ses
        `gemmesRendues` au destinataire. La réponse donne les soldes de l'acheteur.
      operationId: buyItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ActionBase'
                - type: object
                  required: [itemId]
                  properties:
                    itemId: { type: string, minLength: 1, maxLength: 48, example: mvip, description: "identifiant d'un article de `catalog`" }
                    forXuid: { $ref: '#/components/schemas/Xuid' }
      responses:
        '400': { $ref: '#/components/responses/Erreur' }
        '401': { $ref: '#/components/responses/Erreur' }
        '500': { $ref: '#/components/responses/Erreur' }
        '501': { $ref: '#/components/responses/Erreur' }
        '200':
          description: achat fait
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Balances' }
        '409': { $ref: '#/components/responses/Refused' }

  /v1/pass:
    get:
      summary: Progression du pass de saison
      description: |
        Le pass du joueur `actor` pour la saison de `definitions/pass.json` : ses points, s'il a la piste premium,
        les paliers qu'il a déjà réclamés (`claimed`, des textes « palier-PISTE », par exemple `3-GRATUIT`) et tous
        les paliers de la saison avec leur récompense. Un joueur qui n'a encore aucun point est rendu à zéro, sans
        rien écrire. `active` est faux avant le début et après la fin de la saison : les points ne montent que quand
        elle court, mais les paliers atteints se réclament encore après sa fin. Un acteur que le service ne connaît
        pas donne 400. Les points viennent du prestige (chaque associé), de la commande du jour terminée (chaque
        joueur qui a livré) et des missions terminées ; le service les compte, l'add-on ne fait que les montrer.
      operationId: getPass
      parameters: [ { $ref: '#/components/parameters/ActorXuid' } ]
      responses:
        '400': { $ref: '#/components/responses/Erreur' }
        '401': { $ref: '#/components/responses/Erreur' }
        '500': { $ref: '#/components/responses/Erreur' }
        '501': { $ref: '#/components/responses/Erreur' }
        '200':
          description: pass
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PassState' }

  /v1/pass/claims:
    post:
      summary: Réclame un palier du pass
      description: |
        L'acteur réclame la récompense du palier `tier` sur la piste `track` de la saison de `definitions/pass.json`.
        La piste `GRATUIT` verse des Lingots hors prestige ; la piste `PREMIUM` ne donne que des cosmétiques, jamais de
        monnaie. Un palier qui n'existe pas, ou qui n'a pas de récompense sur cette piste, donne 400. Refus 409 :
        `PALIER_NON_ATTEINT` (avec `missing`, les points qui manquent), `PREMIUM_REQUIS` (piste `PREMIUM` sans l'avoir
        achetée), `DEJA_RECLAME` (ce palier de cette piste a déjà été réclamé), `CONFLIT_REESSAYER` si le même
        `requestId` est encore en cours. Rejoué avec le même `requestId`, la réponse est la même et rien n'est versé
        deux fois. Un cosmétique que le joueur a déjà ne bloque pas la réclamation.
      operationId: claimPass
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ActionBase'
                - type: object
                  required: [tier, track]
                  properties:
                    tier: { type: integer, minimum: 1 }
                    track: { type: string, enum: [GRATUIT, PREMIUM] }
      responses:
        '400': { $ref: '#/components/responses/Erreur' }
        '401': { $ref: '#/components/responses/Erreur' }
        '500': { $ref: '#/components/responses/Erreur' }
        '501': { $ref: '#/components/responses/Erreur' }
        '200':
          description: palier réclamé, avec les soldes de l'acteur
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PassClaimed' }
        '409': { $ref: '#/components/responses/Refused' }

  /v1/players/{xuid}/missions:
    get:
      summary: La mission en cours du joueur et celles qu'il a terminées
      description: |
        Les missions se suivent dans l'ordre du catalogue (`definitions/missions.json`) : `current` est la première
        que le joueur n'a pas terminée, `null` quand il les a toutes faites. Le service fait avancer la mission
        d'après les actions du joueur (la première, « bienvenue-mairie », compte un `collect` qui rapporte du Donar),
        la termine de lui-même et verse les Lingots : il n'y a pas de route pour la réclamer. À la fin d'une mission,
        le joueur reçoit un événement `ANNONCE` dont `payload.action` vaut `mission`, avec `missionId` et `rewardLingots`.
        Un joueur inconnu du service donne 400.
      operationId: getMissions
      parameters: [ { $ref: '#/components/parameters/XuidPath' } ]
      responses:
        '400': { $ref: '#/components/responses/Erreur' }
        '401': { $ref: '#/components/responses/Erreur' }
        '500': { $ref: '#/components/responses/Erreur' }
        '501': { $ref: '#/components/responses/Erreur' }
        '200':
          description: missions du joueur
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MissionState' }

  /v1/players/{xuid}/findings:
    get:
      summary: Le Carnet de trouvailles du joueur
      description: |
        Une trouvaille est une ressource que le joueur voit sortir d'une de ses usines pour la première fois : au
        premier `collect` qui rapporte du Donar, chaque ressource que produit une usine en marche de son entreprise
        (`definitions/usines.json`, listes `produit`) entre dans le Carnet si elle n'y est pas déjà. Chaque trouvaille
        rapporte une fois les Lingots hors prestige de `lingotsHorsPrestige.trouvaille` et publie un événement
        `ANNONCE` dont `payload.action` vaut `trouvaille` (`resourceId`, `rewardLingots`). Il n'y a pas de route pour
        en réclamer une : le service les inscrit dans `collect`. Un joueur inconnu du service donne 400.
      operationId: getFindings
      parameters: [ { $ref: '#/components/parameters/XuidPath' } ]
      responses:
        '400': { $ref: '#/components/responses/Erreur' }
        '401': { $ref: '#/components/responses/Erreur' }
        '500': { $ref: '#/components/responses/Erreur' }
        '501': { $ref: '#/components/responses/Erreur' }
        '200':
          description: Carnet du joueur
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FindingBook' }

  /v1/votes/today:
    get:
      summary: Les votes du jour pour le serveur et la Vote party
      description: |
        Les votes que le serveur a reçus aujourd'hui (date UTC), l'objectif de la Vote party et la part du joueur. Les
        votes arrivent de Hubyy par Votifier (TCP, hors de ce contrat) : le service inscrit chaque vote, verse les Lingots
        hors prestige de `definitions/vote.json` (`recompense.lingotsParVote`) et, au bout de `serie.jours` jours de
        suite, `serie.lingotsEnPlus` de plus. Quand le nombre de votes du jour atteint `voteParty.votesParJour`, chaque
        joueur présent reçoit `voteParty.lingotsParJoueur`, une seule fois dans la journée. Cette route ne fait que
        lire. Avec `xuid`, `mine` donne les votes du jour de ce joueur et sa série (0 et 0 sans `xuid`, ou pour un
        joueur qui n'a jamais voté). La série compte les jours UTC de suite, jusqu'à aujourd'hui, où il a voté ; elle
        reste en vie tant qu'il a voté hier et pas encore aujourd'hui. Tous les chiffres viennent de
        `definitions/vote.json`, à valider par Kr. Un vote d'un joueur connu publie un événement `ANNONCE` dont `payload.action`
        vaut `vote` (`site`, `rewardLingots`, `streak`, `streakBonusLingots`) ; la Vote party en publie un pour tout le serveur
        (`xuid` nul), `payload.action` valant `voteParty` (`day`, `votes`, `rewardLingots`, `players`). Un vote reçu pour un
        pseudo que le service ne connaît pas attend ; `join` le verse quand le joueur arrive.
      operationId: todayVotes
      parameters: [ { $ref: '#/components/parameters/PlayerXuidQuery' } ]
      responses:
        '400': { $ref: '#/components/responses/Erreur' }
        '401': { $ref: '#/components/responses/Erreur' }
        '500': { $ref: '#/components/responses/Erreur' }
        '501': { $ref: '#/components/responses/Erreur' }
        '200':
          description: votes du jour
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VotesToday' }

components:
  securitySchemes:
    cleServeur:
      type: apiKey
      in: header
      name: X-Silooo-Key

  parameters:
    CompanyId: { name: companyId, in: path, required: true, schema: { type: integer, format: int64 } }
    FactoryId: { name: factoryId, in: path, required: true, schema: { type: string, example: scierie } }
    XuidPath: { name: xuid, in: path, required: true, schema: { $ref: '#/components/schemas/Xuid' }, description: le joueur concerné }
    PlayerXuidQuery: { name: xuid, in: query, required: false, schema: { $ref: '#/components/schemas/Xuid' }, description: le joueur dont on veut aussi la part }
    ActorXuid: { name: actor, in: query, required: true, schema: { type: string, pattern: '^[0-9]{1,20}$' }, description: le joueur qui agit }
    RequestId: { name: requestId, in: query, required: true, schema: { type: string, format: uuid } }

  requestBodies:
    Action:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ActionBase' }

  responses:
    CompanyUpdated:
      description: action faite ; nouvel état de l'entreprise et des soldes de celui qui agit
      content:
        application/json:
          schema:
            type: object
            required: [state, balances]
            properties:
              state: { $ref: '#/components/schemas/CompanyState' }
              balances: { $ref: '#/components/schemas/Balances' }
    Refused:
      description: action refusée ; `reason` est un code stable, l'add-on choisit l'icône et la bulle d'Oooscar
      content:
        application/json:
          schema:
            type: object
            required: [reason]
            properties:
              reason:
                type: string
                enum: [PAS_ASSEZ_DE_DONAR, PAS_ASSEZ_DE_LINGOTS, PAS_ASSEZ_DE_GEMMES, PAS_LE_PDG, SEUIL_NON_ATTEINT,
                       USINE_VERROUILLEE, ZONE_VERROUILLEE, EMPLACEMENT_OCCUPE, ENTREPRISE_PLEINE, DEJA_POSSEDE,
                       GRADE_PRECEDENT_REQUIS, CONFLIT_REESSAYER, ENTREPRISE_EN_COURS, PALIER_NON_ATTEINT, DEJA_RECLAME,
                       PREMIUM_REQUIS, SAISON_INACTIVE]
              missing: { type: number, description: 'ce qui manque, quand c''est une somme' }
    Erreur:
      description: >-
        erreur technique, hors du jeu ; `reason` est un code stable. 400 REQUETE_INVALIDE (corps ou
        paramètre hors contrat), 401 CLE_INVALIDE (en-tête X-Silooo-Key absent ou faux), 500
        ERREUR_INTERNE (le détail est dans les journaux du service, jamais dans la réponse), 501 PAS_FAIT
        (route du contrat pas encore écrite, ou mise en attente d'une décision de Kr)
      content:
        application/json:
          schema:
            type: object
            required: [reason]
            properties:
              reason:
                type: string
                enum: [REQUETE_INVALIDE, CLE_INVALIDE, ERREUR_INTERNE, PAS_FAIT]

  schemas:
    Xuid:
      type: string
      pattern: '^[0-9]{1,20}$'
      description: XUID en chaîne (un entier 64 bits dépasse la précision des nombres JavaScript)
    Donar:
      type: number
      format: double
    ActionBase:
      type: object
      required: [requestId, actor]
      properties:
        requestId: { type: string, format: uuid }
        actor: { $ref: '#/components/schemas/Xuid' }
    Balances:
      type: object
      required: [lingots, gemmes, jetons, cles]
      properties:
        lingots: { type: integer, format: int64 }
        gemmes: { type: integer, format: int64 }
        jetons: { type: integer, format: int64 }
        cles: { type: integer, format: int64 }
    Factory:
      type: object
      required: [factoryId, state, level, ratePerHour, nextCost, nextMilestone]
      properties:
        factoryId: { type: string }
        state: { type: string, enum: [EN_RUINE, REMISE_EN_ETAT, ACTIVE] }
        restoreStep: { type: integer }
        level: { type: integer }
        ratePerHour: { $ref: '#/components/schemas/Donar' }
        nextCost: { $ref: '#/components/schemas/Donar' }
        nextMilestone: { type: integer, description: prochain palier ×2 }
        incidentId: { type: integer, format: int64, nullable: true, description: "l'incident ouvert de cette usine, s'il y en a un : sa production est alors ralentie (`ratePerHour` en tient compte)" }
        incidentKind: { type: string, nullable: true, description: "la sorte de l'incident ouvert (`definitions/incidents.json`, tableau `sortes`) ; nul sans incident. Elle dit quel mini-jeu l'add-on propose" }
        stoppedNoPower: { type: boolean, description: "époque 3 et plus, sans électricité : l'usine dépend du courant et l'entreprise n'a pas de Centrale active. L'usine est à l'arrêt, `ratePerHour` vaut 0 et elle ne coûte pas de salaire" }
    CompanyState:
      type: object
      required: [companyId, name, era, stars, courseNumber, donar, donarEarned, ratePerHour, multiplier, threshold, factories, version]
      properties:
        companyId: { type: integer, format: int64 }
        name: { type: string }
        era: { type: integer, minimum: 1, maximum: 4 }
        stars: { type: integer }
        courseNumber: { type: integer }
        donar: { $ref: '#/components/schemas/Donar' }
        donarEarned: { $ref: '#/components/schemas/Donar' }
        ratePerHour:
          allOf: [ { $ref: '#/components/schemas/Donar' } ]
          description: "l'add-on fait défiler le compteur à partir de ce revenu, sans rappeler le service ; net des salaires du personnel, bonus de production compris"
        multiplier: { type: number, description: 'Lingots, grade, Pilier, étoiles, bâtiments, boosts' }
        threshold: { $ref: '#/components/schemas/Donar' }
        factories: { type: array, items: { $ref: '#/components/schemas/Factory' } }
        zonesOwned: { type: array, items: { type: integer } }
        city:
          allOf: [ { $ref: '#/components/schemas/CityState' } ]
          description: "la ville de l'entreprise : niveau de la mairie, prochaine zone, bâtiments et bonus. Le service la calcule, l'add-on l'affiche"
        staff:
          type: array
          description: "le personnel embauché de l'entreprise, affecté ou non : l'add-on y lit l'équipe de chaque usine, il ne la calcule pas"
          items: { $ref: '#/components/schemas/Staff' }
        members:
          type: array
          description: "les membres de l'entreprise, le PDG d'abord puis les associés dans l'ordre d'arrivée, avec leur part du partage des Lingots au prestige : les parts font 100 ; l'add-on les affiche, il ne les calcule pas"
          items: { $ref: '#/components/schemas/Member' }
        island:
          type: object
          description: "origine de l'archipel de l'entreprise, en blocs (archipelago_slots) : l'add-on y pose l'île et les usines, il ne la calcule pas"
          required: [x, z]
          properties:
            x: { type: integer }
            z: { type: integer }
        version: { type: integer, description: verrou optimiste }
    JoinResponse:
      type: object
      required: [xuid, firstJoin, companyId, balances, state]
      properties:
        xuid: { $ref: '#/components/schemas/Xuid' }
        firstJoin: { type: boolean, description: vrai = lancer le tutoriel d'Oooscar }
        tutorialStep: { type: integer }
        companyId: { type: integer, format: int64 }
        role: { type: string, enum: [PDG, ASSOCIE] }
        rank: { type: string, nullable: true }
        pilierUntil: { type: string, format: date-time, nullable: true }
        balances: { $ref: '#/components/schemas/Balances' }
        state: { $ref: '#/components/schemas/CompanyState' }
        offlineCollected: { $ref: '#/components/schemas/Donar' }
    Member:
      type: object
      description: |
        Un membre de l'entreprise, PDG ou associé. `sharePercent` est sa part, en pourcent entier, du partage des Lingots
        au prestige ; les parts de tous les membres font 100. `name` est le gamertag du joueur.
      required: [xuid, name, role, sharePercent]
      properties:
        xuid: { $ref: '#/components/schemas/Xuid' }
        name: { type: string }
        role: { type: string, enum: [PDG, ASSOCIE] }
        sharePercent: { type: integer, minimum: 0, maximum: 100 }
    Staff:
      type: object
      description: |
        Un candidat du jour ou un membre du personnel. `staffId` n'existe qu'une fois embauché ; `slot` n'existe que
        pour un candidat du jour ; `factoryId` est nul tant que le membre n'a pas d'usine. `bonusPercent` est le gain
        de production de la rareté, en pourcent de la production de l'usine où il travaille. `salaryPercent` est son
        salaire, en pourcent du revenu de cette usine ; `salaryPerHour` est ce que ce salaire coûte à l'entreprise en
        Donar par heure, maintenant (zéro tant que le membre n'a pas d'usine active). `hireCost` est le prix d'embauche
        d'un candidat libre, en Donar, au revenu de l'entreprise de maintenant. `EPIQUE` est la troisième rareté
        (« légendaire » du game design) : le nom affiché est à confirmer par Kr.
      required: [name, role, rarity, bonusPercent, skinId]
      properties:
        staffId: { type: integer, format: int64 }
        slot: { type: integer }
        name: { type: string }
        skinId: { type: string }
        role: { type: string, enum: [SALARIE, CHEF, DIRECTEUR] }
        rarity: { type: string, enum: [COMMUN, RARE, EPIQUE] }
        bonusPercent: { type: number }
        salaryPercent: { type: number }
        salaryPerHour: { $ref: '#/components/schemas/Donar' }
        hireCost: { $ref: '#/components/schemas/Donar' }
        factoryId: { type: string, nullable: true }
        housed: { type: boolean, description: "vrai si un logement de la ville l'héberge : son salaire est réduit, `salaryPercent` et `salaryPerHour` le disent déjà" }
    CityState:
      type: object
      description: |
        La ville de l'entreprise, telle que le service la calcule : l'add-on en lit les zones à acheter, les bâtiments
        et ce qu'ils donnent, il ne calcule aucun prix ni aucun bonus. Les chiffres viennent de `definitions/ville.json`
        et de `definitions/economie.json` (`ville.zonesPrixLingots`).
      required: [mairieLevel, buildings, bonuses]
      properties:
        mairieLevel: { type: integer, minimum: 1, description: "niveau de la mairie ; il ouvre les zones et les niveaux des bâtiments" }
        nextZone:
          type: object
          nullable: true
          description: "la prochaine zone à acheter ; nul quand toutes les zones sont à l'entreprise"
          required: [zoneIndex, priceLingots, mairieLevelRequired, activeFactoriesRequired]
          properties:
            zoneIndex: { type: integer, minimum: 1, maximum: 16 }
            priceLingots: { type: integer, format: int64 }
            mairieLevelRequired: { type: integer, minimum: 1 }
            activeFactoriesRequired: { type: integer, minimum: 0, description: "usines actives qu'il faut avoir ; 0 sauf pour la première zone" }
        buildings: { type: array, items: { $ref: '#/components/schemas/CityBuilding' } }
        bonuses: { $ref: '#/components/schemas/CityBonuses' }
    CityBuilding:
      type: object
      description: |
        Un bâtiment de la ville. `bonusType` et `bonus` disent ce qu'il donne à son niveau (nuls pour la mairie et les
        routes) ; `nextLevel` dit ce que coûte le niveau suivant et ce qu'il demande, et il est nul au dernier niveau.
      required: [buildingId, buildingType, level, maxLevel, zoneIndex, x, z, rotation]
      properties:
        buildingId: { type: integer, format: int64 }
        buildingType: { type: string, example: maison, description: "identifiant du catalogue des bâtiments (`definitions/ville.json`) ; l'add-on en tire le nom et l'aspect" }
        level: { type: integer, minimum: 1 }
        maxLevel: { type: integer, minimum: 1 }
        zoneIndex: { type: integer, minimum: 1, maximum: 16 }
        x: { type: integer, minimum: 0, description: "coin de la parcelle, en blocs depuis le coin de l'île principale" }
        z: { type: integer, minimum: 0 }
        rotation: { type: integer, enum: [0, 90, 180, 270] }
        bonusType: { type: string, enum: [LOGEMENTS, PRODUCTION_DONAR, LIVRAISON_VITESSE], nullable: true }
        bonus: { type: number, nullable: true, description: "ce que ce bâtiment donne à son niveau : des places pour LOGEMENTS, des pourcents pour les autres types" }
        nextLevel:
          type: object
          nullable: true
          required: [priceLingots, mairieLevelRequired]
          properties:
            priceLingots: { type: integer, format: int64 }
            mairieLevelRequired: { type: integer, minimum: 1 }
    CityBonuses:
      type: object
      description: |
        Ce que les bâtiments donnent ensemble, plafonds de `definitions/ville.json` appliqués. Aucun bonus ne donne de
        Lingots. `donarProductionPercent` est déjà dans `multiplier` ; `deliverySpeedPercent` est pour les camions de
        livraison, que l'add-on affiche.
      required: [housingPlaces, housedStaff, donarProductionPercent, deliverySpeedPercent]
      properties:
        housingPlaces: { type: integer, minimum: 0, description: "places de logement (maisons, immeubles)" }
        housedStaff: { type: integer, minimum: 0, description: "membres du personnel logés ; jamais plus que les places" }
        donarProductionPercent: { type: number, minimum: 0, description: "production de Donar en plus, en pourcent, pour toute l'entreprise" }
        deliverySpeedPercent: { type: number, minimum: 0, description: "vitesse des camions de livraison en plus, en pourcent" }
    PrestigePreview:
      type: object
      required: [allowed, lingotsTotal, shares, next]
      properties:
        allowed: { type: boolean }
        lingotsTotal: { type: integer, format: int64 }
        lingotsIfDoubled: { type: integer, format: int64, description: pour montrer le rendement décroissant }
        shares:
          type: array
          items:
            type: object
            properties:
              xuid: { $ref: '#/components/schemas/Xuid' }
              lingots: { type: integer, format: int64 }
        next: { type: string, enum: [EPOQUE_2, EPOQUE_3, EPOQUE_4, ETOILE] }
    Mission:
      type: object
      required: [id, progress, target, rewardLingots]
      properties:
        id: { type: string, example: bienvenue-mairie, description: 'identifiant du catalogue des missions ; l''add-on en tire le texte' }
        progress: { type: integer, minimum: 0, description: actions faites }
        target: { type: integer, minimum: 1, description: actions à faire }
        rewardLingots: { type: integer, format: int64, minimum: 0, description: Lingots versés quand la mission est terminée }
    MissionState:
      type: object
      required: [current, completed]
      properties:
        current: { allOf: [ { $ref: '#/components/schemas/Mission' } ], nullable: true, description: la première mission pas terminée ; null quand toutes le sont }
        completed: { type: array, items: { type: string }, description: 'les missions terminées, dans l''ordre du catalogue' }
    PassState:
      type: object
      required: [seasonId, name, startsOn, endsOn, active, points, premium, claimed, tiers]
      properties:
        seasonId: { type: string, example: saison-1, description: 'l''identifiant de la saison (pass.json, saison.id)' }
        name: { type: string, description: 'le nom de la saison (pass.json, saison.nom)' }
        startsOn: { type: string, format: date, description: 'le premier jour de la saison (UTC)' }
        endsOn: { type: string, format: date, description: 'le dernier jour de la saison (UTC)' }
        active: { type: boolean, description: 'la saison court aujourd''hui : les points montent et le premium s''achète' }
        points: { type: integer, minimum: 0, description: 'les points du joueur dans cette saison' }
        premium: { type: boolean, description: 'le joueur a acheté la piste premium de cette saison' }
        claimed: { type: array, items: { type: string, example: '3-GRATUIT' }, description: 'les paliers réclamés, « palier-PISTE », dans l''ordre des paliers puis GRATUIT avant PREMIUM' }
        tiers: { type: array, items: { $ref: '#/components/schemas/PassTier' }, description: 'les paliers de la saison, du premier au dernier' }
    PassTier:
      type: object
      required: [tier, points, free, premium]
      properties:
        tier: { type: integer, minimum: 1 }
        points: { type: integer, minimum: 1, description: 'les points du joueur à atteindre, en tout, pour réclamer ce palier' }
        free: { allOf: [ { $ref: '#/components/schemas/PassFreeReward' } ], nullable: true, description: 'la récompense de la piste GRATUIT ; null quand ce palier n''en a pas' }
        premium: { allOf: [ { $ref: '#/components/schemas/PassPremiumReward' } ], nullable: true, description: 'la récompense de la piste PREMIUM ; null quand ce palier n''en a pas' }
    PassFreeReward:
      type: object
      required: [lingots]
      properties:
        lingots: { type: integer, format: int64, minimum: 1, description: 'Lingots hors prestige' }
    PassPremiumReward:
      type: object
      required: [cosmeticId]
      properties:
        cosmeticId: { type: string, minLength: 1, maxLength: 48, description: 'identifiant d''un cosmétique : la piste premium ne donne que des cosmétiques' }
    PassClaimed:
      type: object
      required: [seasonId, tier, track, rewardLingots, cosmeticId, balances]
      properties:
        seasonId: { type: string }
        tier: { type: integer, minimum: 1 }
        track: { type: string, enum: [GRATUIT, PREMIUM] }
        rewardLingots: { type: integer, format: int64, minimum: 0, description: 'les Lingots versés (0 sur la piste PREMIUM)' }
        cosmeticId: { type: string, nullable: true, description: 'le cosmétique donné (null sur la piste GRATUIT)' }
        balances: { $ref: '#/components/schemas/Balances' }
    WorldOrder:
      type: object
      required: [day, resourceId, target, delivered, rewardLingots]
      properties:
        day: { type: string, format: date }
        resourceId: { type: string }
        target: { type: number }
        delivered: { type: number }
        rewardLingots: { type: integer, format: int64, description: 'Lingots hors prestige versés à chaque joueur qui a livré, quand la commande est terminée' }
        completed: { type: boolean }
        mine: { type: number, description: la part déjà livrée par le joueur demandé (0 sans xuid) }
    OrderDelivered:
      type: object
      required: [order, state, balances]
      properties:
        order: { $ref: '#/components/schemas/WorldOrder' }
        state: { $ref: '#/components/schemas/CompanyState' }
        balances: { $ref: '#/components/schemas/Balances' }
    VotesToday:
      type: object
      required: [day, votes, goal, partyReached, rewardLingots, partyRewardLingots, streakGoalDays, streakBonusLingots, mine]
      properties:
        day: { type: string, format: date, description: le jour de jeu (UTC) }
        votes: { type: integer, minimum: 0, description: les votes que le serveur a reçus aujourd'hui }
        goal: { type: integer, minimum: 1, description: 'les votes du jour qui déclenchent la Vote party (voteParty.votesParJour)' }
        partyReached: { type: boolean, description: la Vote party a eu lieu aujourd'hui (votes >= goal) }
        rewardLingots: { type: integer, format: int64, minimum: 0, description: 'Lingots hors prestige versés pour un vote (recompense.lingotsParVote)' }
        partyRewardLingots: { type: integer, format: int64, minimum: 0, description: 'Lingots hors prestige versés à chaque joueur présent quand la Vote party a lieu (voteParty.lingotsParJoueur)' }
        streakGoalDays: { type: integer, minimum: 2, description: 'jours de vote de suite qui donnent le bonus de série (serie.jours)' }
        streakBonusLingots: { type: integer, format: int64, minimum: 0, description: 'Lingots de plus pour le vote qui boucle la série (serie.lingotsEnPlus)' }
        mine: { $ref: '#/components/schemas/PlayerVotes' }
    PlayerVotes:
      type: object
      required: [votes, streak]
      properties:
        votes: { type: integer, minimum: 0, description: les votes du joueur aujourd'hui (0 sans xuid) }
        streak: { type: integer, minimum: 0, description: 'les jours UTC de suite où il a voté, jusqu''à aujourd''hui ou hier (0 sans xuid)' }
    Finding:
      type: object
      required: [id, foundAt]
      properties:
        id: { type: string, description: 'identifiant de la ressource trouvée (usines.json, produit)' }
        foundAt: { type: string, format: date-time }
    FindingBook:
      type: object
      required: [found, total, rewardLingots]
      properties:
        found: { type: array, items: { $ref: '#/components/schemas/Finding' }, description: 'les trouvailles du joueur, de la plus ancienne à la plus récente' }
        total: { type: integer, minimum: 0, description: 'le nombre de trouvailles que le jeu propose' }
        rewardLingots: { type: integer, format: int64, minimum: 0, description: Lingots versés pour chaque trouvaille }
    Listing:
      type: object
      required: [listingId, sellerXuid, resourceId, remaining, unitPrice]
      properties:
        listingId: { type: integer, format: int64 }
        sellerXuid: { $ref: '#/components/schemas/Xuid' }
        resourceId: { type: string }
        remaining: { type: integer, format: int64 }
        unitPrice: { type: integer, format: int64 }
    GameEvent:
      description: |
        `INCIDENT` : l'usine d'une entreprise tombe en panne, ou un incident est réparé. Un événement par membre de
        l'entreprise connecté (`xuid`). `payload.action` vaut `opened` ou `resolved` ; `payload.companyId`,
        `payload.incidentId`, `payload.factoryId` et `payload.kind` (la sorte de `definitions/incidents.json`) sont toujours là.
        `opened` ajoute `payload.slowdown` (le facteur sur la production de l'usine, entre 0 et 1) ; `resolved` ajoute
        `payload.reward` (le Donar versé, 0 quand l'incident était déjà clos) et `payload.resolvedBy` (le XUID de
        celui qui a réparé). Un incident ne s'ouvre jamais pendant que tous les membres sont hors ligne.

        Le service publie, pour le bot Discord (`docs/discord.md`) qui les lit avec son propre curseur : `PRESTIGE_ENTREPRISE`
        (sans `xuid` ; `companyId`, `companyName`, `lingots`, `prestigeCount`) ; `BOOST_COLLECTIF` (`percent`, `minutes`, et
        `buyerName` quand un joueur l'a offert ; aucune route ne le publie encore) ; `ANNONCE` dont `payload.action` vaut
        `voteParty` (sans `xuid` ; `day`, `votes`, `rewardLingots`, `players`) ; `ANNONCE` dont `payload.action` vaut
        `sansCourant` (adressée à celui qui remet l'usine en état ; `companyId`, `factoryId`, `factoryName`, `playerName`).
      type: object
      required: [id, kind, payload]
      properties:
        id: { type: integer, format: int64 }
        xuid: { allOf: [ { $ref: '#/components/schemas/Xuid' } ], nullable: true }
        kind:
          type: string
          enum: [GEMMES_RECUES, COMMANDE_TERMINEE, PRESTIGE_ENTREPRISE, INVITATION, VENTE_MARCHE, INCIDENT, BOOST_COLLECTIF, ANNONCE]
        payload: { type: object, additionalProperties: true }
