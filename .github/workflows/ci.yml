name: CI

# Sur chaque push (toutes branches) et chaque demande de fusion. Une nouvelle exécution sur la même
# branche annule la précédente : seule la dernière compte.
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # La même commande que celle des sessions Claude : tools/verifier.sh (définitions, anti-IA, liens
  # morts, tests de l'outillage, et core/ addon/ resource-pack/ quand ils existent). Java : Temurin 17
  # pour les tests Gradle de core/, avec le cache Gradle ; le runner a Docker, donc les tests
  # Testcontainers (migrations sur mariadb:12.3.3) tournent ici au lieu d'être ignorés.
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: "**/package-lock.json"
      # Chromium pour tools/verifier_site.mjs (les pages du site dans un navigateur), à la version du paquet playwright de
      # package.json ; --with-deps pose ses bibliothèques système. npm ci d'abord : la commande vient de node_modules.
      - name: Installer Chromium pour Playwright
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # tools/generer_sons.py --verifier refait les sons par synthèse : versions essayées (docs/carriere.md).
      - name: Installer numpy et scipy
        run: python -m pip install numpy==2.3.5 scipy==1.16.3
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # gradle-wrapper.jar est un binaire versionné : on contrôle sa somme contre celles de Gradle.
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: Vérifier le dépôt
        run: bash tools/verifier.sh

  # L'image de silooo-core (core/Dockerfile), construite à chaque poussée une fois le dépôt vérifié.
  # Le contexte est la racine du dépôt : l'image embarque definitions/ (core/Dockerfile.dockerignore
  # dit ce qui entre dans le contexte).
  # Sur main seulement, elle part sur le registre GitHub, taguée par commit (SHA) et « main ».
  # Le registre est privé : le tirage sur le VPS demandera une clé de lecture, posée par Kr.
  image:
    needs: verifier
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/e-quantum/silooo-core
      # Vrai seulement pour une poussée sur main : les branches et les demandes de fusion construisent sans publier.
      PUBLIER: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Se connecter au registre GitHub
        if: env.PUBLIER == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construire l'image (et la pousser sur main)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: core/Dockerfile
          push: ${{ env.PUBLIER == 'true' }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Les fichiers de deploy/ qui ne passent pas par une image : les scripts shell (ShellCheck, installé sur le runner)
  # et le compose, lu par Docker Compose lui-même avec un fichier d'environnement factice. Le compose se lance comme
  # le fait deploy/scripts/deploy.sh : projet silooo, dossier de projet là où est le fichier d'environnement.
  # Les tests de ces fichiers (tools/tests/deploy-*) tournent déjà dans le job verifier.
  deploy-fichiers:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck sur les scripts de deploy/ et leurs tests
        run: |
          set -euo pipefail
          shellcheck --version
          mapfile -t scripts < <(find deploy -name '*.sh' | sort)
          echo "${#scripts[@]} script(s) dans deploy/ :"
          printf '  %s\n' "${scripts[@]}"
          # .shellcheckrc (racine du dépôt) : external-sources et source-path=SCRIPTDIR, pour suivre commun.sh.
          shellcheck "${scripts[@]}" tools/tests/deploy-start.sh tools/tests/deploy-deploy.sh
      - name: Valider deploy/compose.yml avec un fichier d'environnement factice
        run: |
          set -euo pipefail
          dossier="$(mktemp -d)"
          # Valeurs fausses, écrites dans un dossier jetable : le compose les exige (${VAR:?}) mais rien n'en sort.
          cat > "$dossier/.env" <<'FIN'
          SILOOO_DB_URL=jdbc:mariadb://mariadb:3306/silooo
          SILOOO_DB_USER=silooo
          SILOOO_DB_PASSWORD=mot-de-passe-factice-de-la-ci
          SILOOO_API_KEY=cle-factice-de-la-ci
          BDS_PUBLIC_IP=203.0.113.10
          FIN
          docker compose version
          SILOOO_TAG=ci docker compose -p silooo --project-directory "$dossier" -f deploy/compose.yml config -q
          echo "deploy/compose.yml : valide."

  # L'image de silooo-bds (deploy/bds/Dockerfile) : l'add-on construit, start.sh et les modèles de configuration. Elle
  # ne contient PAS le serveur Bedrock (décision 26) : minecraft.net refuse les clients qui ne sont pas des navigateurs,
  # le zip ne se redistribue pas, et le User-Agent n'est pas déguisé. Kr pose le zip dans le dossier monté sur /data/bds ;
  # start.sh le contrôle au démarrage. La construction n'a donc aucun besoin du réseau de Mojang. Même logique que le job
  # image ci-dessus : contexte à la racine, construite à chaque poussée, poussée sur main seulement.
  image-bds:
    needs: [verifier, deploy-fichiers]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/e-quantum/silooo-bds
      PUBLIER: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      BUILDKIT_PROGRESS: plain
    steps:
      - uses: actions/checkout@v4
      # Information, ne bloque pas : ce que répond le site de Minecraft au téléchargement de BDS depuis un runner, avec
      # l'identité honnête de l'image (le User-Agent du Dockerfile), en HTTP/2 puis en HTTP/1.1, puis un essai de
      # téléchargement du zip. Si le zip arrive avec le bon MD5 (deploy/bds/bds.md5), il sert à l'essai de démarrage
      # plus bas ; sinon le journal dit pourquoi. Rien n'est déguisé : le User-Agent ne change pas, et le zip n'est ni
      # publié ni gardé (le dossier du runner disparaît avec lui).
      - name: Sonder le téléchargement de BDS
        continue-on-error: true
        run: |
          set -uo pipefail
          version="$(sed -n 's/^ARG BDS_VERSION=//p' deploy/bds/Dockerfile)"
          agent="$(sed -n 's/^ARG BDS_USER_AGENT="\(.*\)"$/\1/p' deploy/bds/Dockerfile)"
          url="https://www.minecraft.net/bedrockdedicatedserver/bin-linux/bedrock-server-${version}.zip"
          echo "version=$version ; agent=$agent"
          curl --version | head -n 1
          for protocole in --http2 --http1.1; do
            echo "--- HEAD $protocole"
            curl -sS -I "$protocole" --max-time 30 --user-agent "$agent" "$url" 2>&1 | head -n 25 || true
          done
          echo "--- GET du zip, 2 essais de 60 s"
          mkdir -p "$RUNNER_TEMP/bds"
          for essai in 1 2; do
            if curl --fail --silent --show-error --location --connect-timeout 30 --max-time 60 --user-agent "$agent" \
              --output "$RUNNER_TEMP/bds/zip.partiel" "$url"; then
              attendu="$(grep -Ev '^[[:space:]]*(#|$)' deploy/bds/bds.md5 | awk '{ print $1 }')"
              obtenu="$(md5sum "$RUNNER_TEMP/bds/zip.partiel" | awk '{ print $1 }')"
              echo "MD5 attendu $attendu ; obtenu $obtenu ; SHA-256 $(sha256sum "$RUNNER_TEMP/bds/zip.partiel" | awk '{ print $1 }')"
              if [ "$attendu" = "$obtenu" ]; then
                mv "$RUNNER_TEMP/bds/zip.partiel" "$RUNNER_TEMP/bds/bedrock-server-${version}.zip"
                echo "zip téléchargé et conforme au MD5 de Mojang"
                break
              fi
              echo "::warning::Le zip téléchargé n'a pas le MD5 attendu : il n'est pas utilisé."
            fi
            rm -f "$RUNNER_TEMP/bds/zip.partiel"
          done
          ls -l "$RUNNER_TEMP/bds"
      - uses: docker/setup-buildx-action@v3
      - name: Construire l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/bds/Dockerfile
          load: true
          tags: silooo-bds:ci
          cache-from: type=gha,scope=bds
          cache-to: type=gha,mode=max,scope=bds
      - name: Contrôler l'image (taille, utilisateur, packs, pas de BDS, rendu de la configuration)
        run: |
          set -euo pipefail
          docker image ls silooo-bds:ci
          taille="$(docker image inspect silooo-bds:ci --format '{{.Size}}')"
          echo "Taille de l'image : $((taille / 1024 / 1024)) Mo"
          docker run --rm --entrypoint sh silooo-bds:ci -c 'set -e; id; test "$(id -u)" = 10001; ls -l /opt/silooo /opt/silooo/pack; test -f /opt/silooo/pack/manifest.json; test -f /opt/silooo/pack/scripts/main.js; ls /opt/silooo/resource-pack; test -f /opt/silooo/resource-pack/manifest.json; test -f /opt/silooo/resource-pack/ui/hud_screen.json; test -f /opt/silooo/resource-pack/textures/entity/oooscar.png; test -f /opt/silooo/bds.sha256; test -f /opt/silooo/bds.md5; test -d /data/bds; command -v unzip jq curl'
          # Décision 26 : le serveur Bedrock n'est pas dans l'image.
          present="$(docker run --rm --entrypoint sh silooo-bds:ci -c 'find / -xdev -name bedrock_server -print 2>/dev/null; ls -d /opt/bds 2>/dev/null; true')"
          if [ -n "$present" ]; then echo "::error::BDS ne doit pas être dans l'image : $present"; exit 1; fi
          echo "BDS n'est pas dans l'image."
          # start.sh rend la configuration dans un dossier jetable, sans chercher le zip ni lancer le serveur. La clé est
          # factice : avec un pack, start.sh la veut pour écrire secrets.json.
          docker run --rm -e SILOOO_API_KEY=cle-factice-de-la-ci -e BDS_PUBLIC_IP=203.0.113.10 --entrypoint sh silooo-bds:ci \
            -c '/opt/silooo/start.sh --rendre-seulement /tmp/rendu && cat /tmp/rendu/server.properties && find /tmp/rendu -maxdepth 3 | sort | head -n 40'
          # Le pack de ressources de l'image arrive dans resource_packs/silooo et le monde le liste (uuid de son manifeste).
          docker run --rm -e SILOOO_API_KEY=cle-factice-de-la-ci -e BDS_PUBLIC_IP=203.0.113.10 --entrypoint sh silooo-bds:ci \
            -c 'set -e; /opt/silooo/start.sh --rendre-seulement /tmp/rendu >/dev/null; test -f /tmp/rendu/resource_packs/silooo/manifest.json; test -f /tmp/rendu/resource_packs/silooo/ui/hud_screen.json; test -f /tmp/rendu/resource_packs/silooo/textures/entity/oooscar.png; grep -q "$(jq -r .header.uuid /opt/silooo/resource-pack/manifest.json)" /tmp/rendu/worlds/silooo/world_resource_packs.json; grep -qx "texturepack-required=true" /tmp/rendu/server.properties; cat /tmp/rendu/worlds/silooo/world_resource_packs.json'
          echo "Le pack de ressources est dans l'image, copié par start.sh et listé dans le monde."
      # Sans zip dans le dossier monté, start.sh doit s'arrêter avec la marche à suivre pour Kr, et un code non nul.
      - name: Vérifier l'arrêt de start.sh sans zip de BDS
        run: |
          set -uo pipefail
          dossier="$(mktemp -d)"
          # Le conteneur tourne en uid 10001 : le dossier lui est ouvert, comme le chown 10001:10001 de Kr.
          chmod 777 "$dossier"
          # Le shell de GitHub est lancé avec -e : le code de sortie attendu (66) est lu sans arrêter le script.
          code=0
          sortie="$(docker run --rm -e SILOOO_API_KEY=cle-factice-de-la-ci -e BDS_PUBLIC_IP=203.0.113.10 \
            -e BDS_URL=http://127.0.0.1:9/bedrock-server.zip -v "$dossier:/data/bds" silooo-bds:ci 2>&1)" || code=$?
          printf '%s\n' "$sortie" | tail -n 30
          if [ "$code" -ne 66 ]; then echo "::error::Sans zip, start.sh devait sortir en 66 (code $code)"; exit 1; fi
          if ! printf '%s\n' "$sortie" | grep -q "SILOOO_BDS_DIR"; then echo "::error::Le message pour Kr manque"; exit 1; fi
          echo "Sans zip : sortie 66 et marche à suivre affichée."
      # Information, ne bloque pas. Il faut un zip de BDS : celui que la sonde plus haut a pu télécharger. Depuis un
      # runner, minecraft.net répond mal (décision 26) ; sans zip, l'étape le dit et réussit.
      - name: Démarrer le serveur quarante-cinq secondes puis l'arrêter (information, ne bloque pas)
        continue-on-error: true
        run: |
          set -uo pipefail
          version="$(sed -n 's/^ARG BDS_VERSION=//p' deploy/bds/Dockerfile)"
          zip="$RUNNER_TEMP/bds/bedrock-server-${version}.zip"
          if [ ! -f "$zip" ]; then
            echo "Pas de zip de BDS sur ce runner : la sonde n'a pas pu le télécharger depuis minecraft.net (voir son journal)."
            echo "L'essai de démarrage est sauté. Il se fait sur le VPS, avec le zip que Kr y pose (docs/deploiement.md, « Le zip de BDS »)."
            exit 0
          fi
          chmod 777 "$RUNNER_TEMP/bds"
          # -it comme stdin_open et tty du compose : la console de BDS lit l'entrée standard.
          docker run -dit --name bds-essai -e SILOOO_API_KEY=cle-factice-de-la-ci -e BDS_PUBLIC_IP=203.0.113.10 \
            -v "$RUNNER_TEMP/bds:/data/bds" silooo-bds:ci
          sleep 45
          echo "--- journal après 45 s"
          docker logs bds-essai 2>&1 | tail -n 40
          echo "--- arrêt par SIGINT (le signal du compose)"
          debut=$SECONDS
          docker kill --signal=SIGINT bds-essai
          docker wait bds-essai
          echo "arrêté en $((SECONDS - debut)) s"
          docker logs bds-essai 2>&1 | tail -n 15
      - name: Se connecter au registre GitHub
        if: env.PUBLIER == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pousser l'image (sur main seulement)
        if: env.PUBLIER == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/bds/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:main
          cache-from: type=gha,scope=bds
          cache-to: type=gha,mode=max,scope=bds

  # La migration V1 rejouée sur la même version de MariaDB que la production (12.3.3 sur SileneMC).
  # Les tests Testcontainers de core/ (job verifier) rejouent aussi les migrations avec Flyway ; ceci
  # reste le contrôle du fichier SQL brut, avec le client mariadb, sans Gradle.
  migration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Mot de passe jetable d'un conteneur qui n'existe que le temps du job.
      MARIADB_ROOT_PASSWORD: ci-${{ github.run_id }}
    services:
      mariadb:
        image: mariadb:12.3.3
        env:
          # Le contexte « env » n'existe pas ici : même valeur que ci-dessus, bâtie de la même façon.
          MARIADB_ROOT_PASSWORD: ci-${{ github.run_id }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - name: Installer le client mariadb
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mariadb-client
      - name: Créer la base silooo
        run: |
          export MYSQL_PWD="$MARIADB_ROOT_PASSWORD"
          mariadb --protocol=tcp -h 127.0.0.1 -P 3306 -u root \
            -e "CREATE DATABASE silooo CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci"
      - name: Rejouer V1__init.sql et compter les tables
        run: |
          set -euo pipefail
          export MYSQL_PWD="$MARIADB_ROOT_PASSWORD"
          script=core/src/main/resources/db/migration/V1__init.sql
          mariadb --protocol=tcp -h 127.0.0.1 -P 3306 -u root silooo < "$script"
          # Le nombre attendu vient du script lui-même : pas de chiffre écrit ici.
          attendu="$(grep -ciE '^[[:space:]]*CREATE[[:space:]]+TABLE' "$script")"
          obtenu="$(mariadb --protocol=tcp -h 127.0.0.1 -P 3306 -u root -N -B -e \
            "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = 'silooo' AND table_type = 'BASE TABLE'")"
          echo "CREATE TABLE dans le script : $attendu ; tables dans la base : $obtenu"
          if [ "$attendu" -lt 1 ] || [ "$attendu" != "$obtenu" ]; then
            echo "::error::La base ne contient pas autant de tables que le script en crée."
            exit 1
          fi
