# Les versions de tout silooo-core, au même endroit. Chaque version a été relevée sur Maven Central
# (ou le portail des plugins Gradle) le 5 novembre 2026 : on ne met pas de version qu'on n'a pas vue.
# Ktor 3.6.1 est compilé avec Kotlin 2.3.21 : on garde Kotlin sur la même version.

[versions]
kotlin = "2.3.21"
ktor = "3.6.1"
kotlinx-serialization = "1.11.0"
kotlinx-coroutines = "1.11.0"
hikari = "7.0.2"
mariadb-jdbc = "3.5.11"
flyway = "13.12.0"
logback = "1.5.38"
junit = "5.14.4"
testcontainers = "2.0.5"
# Lit l'OpenAPI dans les tests de contrat (relevé sur Maven Central le 5 novembre 2026).
snakeyaml = "2.7"

[libraries]
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-cio = { module = "io.ktor:ktor-server-cio", version.ref = "ktor" }
ktor-server-content-negotiation = { module = "io.ktor:ktor-server-content-negotiation", version.ref = "ktor" }
ktor-server-status-pages = { module = "io.ktor:ktor-server-status-pages", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-server-test-host = { module = "io.ktor:ktor-server-test-host", version.ref = "ktor" }

kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }

hikari = { module = "com.zaxxer:HikariCP", version.ref = "hikari" }
mariadb-jdbc = { module = "org.mariadb.jdbc:mariadb-java-client", version.ref = "mariadb-jdbc" }
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
# Le module MySQL/MariaDB de Flyway : sans lui, Flyway ne sait pas parler à MariaDB.
flyway-mysql = { module = "org.flywaydb:flyway-mysql", version.ref = "flyway" }

logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }

junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
testcontainers-mariadb = { module = "org.testcontainers:testcontainers-mariadb", version.ref = "testcontainers" }
snakeyaml = { module = "org.yaml:snakeyaml", version.ref = "snakeyaml" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
