<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Image de partage de Silooo</title>
<!-- Rendu par capturer.mjs avec le public/ du site (site.css, le logo, Oooscar) : ne s'ouvre pas tel quel depuis le dépôt. -->
<link rel="stylesheet" href="/public/site.css">
<style>
  /* L'image de partage (1 200 × 630) : le ciel, le logo, la plaque du nom, Oooscar et sa bulle d'arrivée. Textures ×6. */
  html, body { margin: 0; padding: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; background: var(--ciel); display: flex; align-items: center; justify-content: center; gap: 48px; }
  .logo { height: 440px; width: auto; image-rendering: auto; flex: none; }
  .colonne { display: flex; flex-direction: column; align-items: center; gap: 40px; }
  .sa-plaque { white-space: nowrap; font-size: 110px; line-height: 100px; letter-spacing: 6px; border-width: 30px; border-image-width: 30px; padding: 0 36px; }
  .sa-bulle { max-width: 420px; font-size: 40px; line-height: 54px; border-width: 24px; border-image-width: 24px; padding: 0 12px; text-align: center; }
  .oooscar { height: 420px; width: auto; image-rendering: auto; flex: none; }
</style>
</head>
<body>
  <img class="logo" src="/public/logo/silooo-logo.png" alt="">
  <div class="colonne">
    <span class="sa-plaque">Silooo</span>
    <p class="sa-bulle">Salut ! Moi, c'est Oooscar.</p>
  </div>
  <img class="oooscar" src="/public/atelier/oooscar/oooscar-joie.png" alt="">
</body>
</html>
